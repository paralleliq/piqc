{{- if not .Values.apiKeySecret.name }}
{{- if not .Values.apiKey }}
{{- fail "Set apiKeySecret.name to an existing Secret, or apiKey for a quick start (real key, but avoid this for a long-lived install -- see values.yaml)." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-key" .Release.Name }}
  labels:
    app.kubernetes.io/name: piqc
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  {{ .Values.apiKeySecret.key }}: {{ .Values.apiKey | quote }}
{{- end }}
