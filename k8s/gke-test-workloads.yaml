---
apiVersion: v1
kind: Namespace
metadata:
  name: inference
---
# vLLM Llama-3 70B — simulates a large underutilized deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-llama3-70b
  namespace: inference
  labels:
    app: vllm-llama3-70b
    app.kubernetes.io/name: vllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-llama3-70b
  template:
    metadata:
      labels:
        app: vllm-llama3-70b
        app.kubernetes.io/name: vllm
    spec:
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: us-central1-docker.pkg.dev/piqc-483417/piqc/piqc-mock-vllm:latest
          imagePullPolicy: Always
          command: ["python", "/app/server.py"]
          env:
            - name: VLLM_VERSION
              value: "0.4.2"
            - name: MODEL_NAME
              value: "meta-llama/Meta-Llama-3-70B-Instruct"
            - name: SERVED_MODEL_NAME
              value: "llama3-70b"
            - name: TENSOR_PARALLEL_SIZE
              value: "1"
            - name: DTYPE
              value: "bfloat16"
            - name: MAX_MODEL_LEN
              value: "8192"
            - name: GPU_MEMORY_UTILIZATION
              value: "0.90"
            - name: FAKE_GPU_COUNT
              value: "1"
            - name: FAKE_GPU_MODEL
              value: "Tesla-T4"
            - name: FAKE_GPU_MEMORY_TOTAL
              value: "16384"
            - name: FAKE_GPU_MEMORY_USED
              value: "14745"
            - name: FAKE_GPU_UTILIZATION
              value: "4"
            - name: FAKE_GPU_POWER_DRAW
              value: "30"
            - name: FAKE_GPU_POWER_LIMIT
              value: "70"
          args:
            - "--model"
            - "meta-llama/Meta-Llama-3-70B-Instruct"
            - "--tensor-parallel-size"
            - "1"
            - "--dtype"
            - "bfloat16"
            - "--max-model-len"
            - "8192"
            - "--gpu-memory-utilization"
            - "0.90"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "1"
              memory: "1Gi"
              nvidia.com/gpu: "1"
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-llama3-70b
  namespace: inference
spec:
  selector:
    app: vllm-llama3-70b
  ports:
    - port: 8000
      targetPort: 8000
---
