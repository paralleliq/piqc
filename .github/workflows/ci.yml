name: CI

on:
  push:
    branches: [main]
    # A release tag (vX.Y.Z, the same tags publish-pypi.yml publishes) also
    # pushes the image as X.Y.Z, once: a version already in the registry is
    # refused, so a scan pinned to a release always runs the same image.
    # `latest` follows main, as before. The two workflows run independently,
    # so a failure in one can leave a release with only an image or only a
    # PyPI package.
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Build the image for an existing release tag whose tag push didn't
  # (e.g. a tag pushed before this workflow had the trigger). Only real
  # tags build, and never one whose version is already published.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.11.0"
        required: true

concurrency:
  group: ci-${{ inputs.tag || github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # A manual run tests the tag it builds, not the branch it ran from.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-interaction

      - name: Run unit tests
        run: poetry run pytest tests/unit/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 as well as amd64 (platform #354): NVIDIA's Grace GPU servers
      # (GH200, GB200) and Apple Silicon are arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # main -> latest; a release tag vX.Y.Z -> X.Y.Z, refused unless it is
      # the version in pyproject.toml, and refused if that version is
      # already in the registry (a re-run would otherwise push new bits
      # under a pinned tag). The license label comes from the built
      # commit's pyproject.toml, so it says what that code is under, and the
      # revision is the commit built (on a manual run, the tag's, not main's).
      - name: Image tag
        id: tag
        env:
          REF: ${{ inputs.tag || github.ref_name }}
          IS_TAG: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          license=$(grep -m1 '^license' pyproject.toml | cut -d'"' -f2)
          if [ -z "$license" ]; then
            echo "::error::no license in pyproject.toml"
            exit 1
          fi
          echo "license=$license" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$IS_TAG" != "true" ]; then
            echo "tags=ghcr.io/paralleliq/piqc:latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${REF#v}"
          declared=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $REF is not the version in pyproject.toml ($declared)"
            exit 1
          fi
          # Only a clear "not found" lets it through: an auth or network
          # error stops the run rather than risk overwriting a release.
          if out=$(docker buildx imagetools inspect "ghcr.io/paralleliq/piqc:$version" 2>&1); then
            echo "::error::ghcr.io/paralleliq/piqc:$version is already published; a version tag is never rebuilt"
            exit 1
          elif ! grep -q ": not found" <<<"$out"; then
            echo "::error::couldn't check whether $version is published: $out"
            exit 1
          fi
          echo "tags=ghcr.io/paralleliq/piqc:$version" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.licenses=${{ steps.tag.outputs.license }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tag.outputs.revision }}
