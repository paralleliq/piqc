name: CI

on:
  push:
    branches: [main]
    # A release tag (vX.Y.Z, the same tags publish-pypi.yml publishes) also
    # pushes the image as X.Y.Z, which is never moved, so a scan can be
    # pinned to a release. `latest` follows main, as before.
    tags: ["v*"]
  pull_request:
    branches: [main]
  # Build the image for an existing release tag (e.g. v1.10.0, which
  # predates the version tags).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, e.g. v1.10.0"
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-interaction

      - name: Run unit tests
        run: poetry run pytest tests/unit/ -v

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      # main -> latest; a release tag vX.Y.Z -> X.Y.Z, refused unless it is
      # the version in pyproject.toml, so the image and PyPI agree.
      - name: Image tag
        id: tag
        env:
          REF: ${{ inputs.tag || github.ref_name }}
          IS_TAG: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
        run: |
          set -euo pipefail
          if [ "$IS_TAG" != "true" ]; then
            echo "tags=ghcr.io/paralleliq/piqc:latest" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${REF#v}"
          declared=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$version" != "$declared" ]; then
            echo "::error::tag $REF is not the version in pyproject.toml ($declared)"
            exit 1
          fi
          echo "tags=ghcr.io/paralleliq/piqc:$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # arm64 as well as amd64 (platform #354): NVIDIA's Grace GPU servers
      # (GH200, GB200) and Apple Silicon are arm64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tag.outputs.tags }}
