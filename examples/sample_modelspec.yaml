      type: A100-SXM4-80GB
      memoryTotal: "80GB"
      memoryUsed: "72GB"
      utilization: 87
      temperature: 72
      powerDraw: 320
      podName: llama-70b-chat-5f8b9c-abc12
    - index: 1
      type: A100-SXM4-80GB
      memoryTotal: "80GB"
      memoryUsed: "71GB"
      utilization: 85
      temperature: 70
      powerDraw: 315
      podName: llama-70b-chat-5f8b9c-abc12
  gpuMemoryUtilization: 0.9
  cpuRequest: "8"
  cpuLimit: "16"
  memoryRequest: "64Gi"
  memoryLimit: "128Gi"

endpoints:
  - type: http
    port: 8000
    path: /v1/completions

kubernetes:
  deploymentType: Deployment
  clusterName: prod-ml-cluster
  creationTimestamp: "2024-01-10T08:00:00Z"
  image: vllm/vllm-openai:v0.2.0
  imageTag: v0.2.0

collection:
  mode: remote
  duration: "2.34s"
  warnings: []
  errors: []
  dataCompleteness:
    staticConfig: true
    gpuMetrics: true
    runtimeMetrics: false
