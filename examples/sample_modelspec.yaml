# Example: vLLM Deployment ModelSpec

apiVersion: modelspec.paralleliq.ai/v1
kind: ModelSpec

metadata:
  name: llama-70b-chat
  namespace: inference
  labels:
    app: llama-chat
    team: ml-platform
  collectionTimestamp: "2024-01-15T10:30:45Z"
  collectorVersion: "1.0.0"

model:
  name: meta-llama/Llama-2-70b-chat-hf
  servedName: llama-70b
  source: huggingface
  sourcePath: meta-llama/Llama-2-70b-chat-hf
  architecture: llama
  parameters: "70B"
  confidence: 0.95
  identificationMethod: cli_args

engine:
  name: vllm
  version: "0.2.0"
