apiVersion: v1
kind: ServiceAccount
metadata:
  name: piqc
  namespace: kube-system
  labels:
    app.kubernetes.io/name: piqc
    app.kubernetes.io/part-of: piqc
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: piqc
  labels:
    app.kubernetes.io/name: piqc
    app.kubernetes.io/part-of: piqc
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: piqc
  labels:
    app.kubernetes.io/name: piqc
    app.kubernetes.io/part-of: piqc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: piqc
subjects:
  - kind: ServiceAccount
    name: piqc
    namespace: kube-system
