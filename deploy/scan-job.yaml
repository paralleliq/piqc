apiVersion: batch/v1
kind: Job
metadata:
  name: piqc-scan
  namespace: kube-system
  labels:
    app.kubernetes.io/name: piqc
    app.kubernetes.io/part-of: piqc
spec:
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: piqc
    spec:
      serviceAccountName: piqc
      restartPolicy: Never
      containers:
        - name: piqc
          image: ghcr.io/paralleliq/piqc:latest
          imagePullPolicy: Always
          args:
            - scan
            - --format
            - table
            - --collect-runtime
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
